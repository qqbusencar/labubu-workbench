name: Deploy to GitHub Pages

# 每次推送到 main 分支，自动把静态站点部署到 GitHub Pages
# 无需任何额外令牌：GitHub Actions 自带的 GITHUB_TOKEN 即可部署
# 站点地址：https://qqbusencar.github.io/labubu-workbench/
on:
  push:
    branches: [main]
  workflow_dispatch: # 允许在 GitHub 网页上手动点一下触发

# 赋予 Pages 部署所需权限（GITHUB_TOKEN 自动获得，无需手动配置 Secret）
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个 Pages 部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v4

      - name: 上传站点文件（整个仓库即静态站点）
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
