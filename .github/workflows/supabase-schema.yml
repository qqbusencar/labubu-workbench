name: Sync Supabase Schema

# 当你修改了 schema.sql（改了数据库表结构）并推送到 GitHub 时，
# 自动把最新 schema 应用到你的 Supabase 数据库。
# 需要先在 GitHub 仓库设置 Secrets：SUPABASE_DB_URL（见自动化指南）
on:
  push:
    branches: [main]
    paths: ['schema.sql']   # 只有改了 schema.sql 才跑
  workflow_dispatch:        # 也可在 GitHub 网页手动触发

permissions:
  contents: read

jobs:
  sync-schema:
    runs-on: ubuntu-latest
    # 没配置 SUPABASE_DB_URL 时自动跳过（不会报错变红）
    if: ${{ secrets.SUPABASE_DB_URL != '' }}
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 psql 客户端
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: 应用 schema.sql 到 Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=0 -f schema.sql
