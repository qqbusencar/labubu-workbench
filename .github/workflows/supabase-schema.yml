name: Sync Supabase Schema

# 当你修改了 schema.sql（改了数据库表结构）并推送到 GitHub 时，
# 自动把最新 schema 应用到你的 Supabase 数据库。
# 需要先在 GitHub 仓库设置 Secrets：SUPABASE_DB_URL（见自动化指南）
on:
  push:
    branches: [main]
    paths: ['schema.sql']   # 只有改了 schema.sql 才跑
  workflow_dispatch:        # 也可在 GitHub 网页手动触发

permissions:
  contents: read

jobs:
  sync-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 psql 客户端
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: 应用 schema.sql 到 Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "未设置 SUPABASE_DB_URL，跳过（如需自动建表请在仓库 Settings→Secrets 添加 SUPABASE_DB_URL）。"
            exit 0
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=0 -f schema.sql
